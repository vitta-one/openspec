name: Inspect OpenSpec apply instructions

on:
  push:
    branches:
      - feat/patient-reception-queue-implementation

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Status
        run: npx -y @fission-ai/openspec@1.13.0 status --change add-patient-reception-queue --json
      - name: Apply instructions
        run: npx -y @fission-ai/openspec@1.13.0 instructions apply --change add-patient-reception-queue --json
