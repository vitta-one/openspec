name: Inspect professional specialty apply

on:
  push:
    branches:
      - feat/professional-specialty-management-implementation

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply instructions
        run: npx -y @fission-ai/openspec@1.13.0 instructions apply --change add-professional-specialty-management --json
      - name: Status
        run: npx -y @fission-ai/openspec@1.13.0 status --change add-professional-specialty-management --json
