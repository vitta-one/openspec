name: Build professional directory migration

on:
  push:
    branches:
      - feat/professional-specialty-management-implementation

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vitta_one
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitta_one"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vitta_one
      VITTA_ONE_SESSION_TTL_SECONDS: "3600"
      VITTA_ONE_COOKIE_SECURE: "false"
      REFLEX_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply existing migrations
        run: reflex db migrate
      - name: Run test suite
        run: python -m pytest -q
      - name: Generate migration
        run: |
          reflex db makemigrations --message "add professional specialty management"
          git diff -- alembic/versions
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: professional-directory-migration
          path: alembic/versions/
          if-no-files-found: error
          retention-days: 1
