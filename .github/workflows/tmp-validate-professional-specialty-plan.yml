name: Validate professional specialty proposal

on:
  push:
    branches:
      - feat/professional-specialty-management

permissions:
  contents: read

jobs:
  validate-openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Context
        run: npx -y @fission-ai/openspec@1.13.0 context --json
      - name: Strict validation
        run: npx -y @fission-ai/openspec@1.13.0 validate add-professional-specialty-management --strict --no-interactive
      - name: Status
        run: npx -y @fission-ai/openspec@1.13.0 status --change add-professional-specialty-management --json
