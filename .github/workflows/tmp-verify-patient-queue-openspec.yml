name: Verify patient queue OpenSpec completion

on:
  push:
    branches:
      - feat/patient-reception-queue-implementation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Strict validation
        run: npx -y @fission-ai/openspec@1.13.0 validate add-patient-reception-queue --strict --no-interactive
      - name: Final status
        run: npx -y @fission-ai/openspec@1.13.0 status --change add-patient-reception-queue --json
      - name: Final apply state
        run: npx -y @fission-ai/openspec@1.13.0 instructions apply --change add-patient-reception-queue --json
