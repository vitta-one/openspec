name: Vitta One | CI Produção

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitta-prod-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: OpenSpec, migrations QA, Pytest, Reflex e smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vitta_one_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitta_one_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vitta_one_test
      VITTA_ONE_SESSION_TTL_SECONDS: '3600'
      VITTA_ONE_COOKIE_SECURE: 'false'
      VITTA_ONE_CLINIC_TIMEZONE: America/Sao_Paulo
      VITTA_ONE_LOCAL_ADMIN_PREVIEW: 'true'
      VITTA_ONE_QA_DISPOSABLE_DATABASE: 'yes'
      REFLEX_TELEMETRY_ENABLED: 'false'
      CI: 'true'

    steps:
      - name: Checkout do SHA exato
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validação OpenSpec strict
        run: npx --yes @fission-ai/openspec validate --all --strict
      - name: Migrations em PostgreSQL 16 descartável
        run: |
          reflex db migrate
          alembic current --check-heads
      - name: Testes Python
        run: python -m pytest -q
      - name: Compilação Reflex
        run: reflex compile --dry
      - name: Build de produção e smoke HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p qa-artifacts
          reflex run --env prod --frontend-port 3000 --backend-host 127.0.0.1 \
            > qa-artifacts/reflex-prod.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsSL --max-time 5 http://127.0.0.1:3000/login -o /dev/null; then
              echo 'Smoke de produção: HTTP 200'
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo 'Servidor encerrado antes do smoke' >&2
              tail -n 120 qa-artifacts/reflex-prod.log
              exit 1
            fi
            sleep 2
          done
          echo 'Timeout aguardando produção' >&2
          tail -n 120 qa-artifacts/reflex-prod.log
          exit 1
      - name: Logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-prod-logs-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 7
