name: QA Prescrições com Chromium

on:
  pull_request:
    branches:
      - develop
    paths:
      - "scripts/qa_seed_prescriptions.py"
      - "qa_browser/prescription_browser.py"
      - "qa_browser/capture_all_screens.py"
      - "scripts/qa_seed_visual_accounts.py"
      - ".github/workflows/qa-prescriptions-browser.yml"
      - "vitta_one/**"
      - "assets/styles.css"
  workflow_dispatch:

concurrency:
  group: chromium-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vitta_one
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitta_one"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vitta_one
      VITTA_ONE_SESSION_TTL_SECONDS: "3600"
      VITTA_ONE_COOKIE_SECURE: "false"
      VITTA_ONE_CLINIC_TIMEZONE: "America/Sao_Paulo"
      REFLEX_TELEMETRY_ENABLED: "false"
      VITTA_ONE_QA_DISPOSABLE_DATABASE: "yes"
      VITTA_ONE_LOCAL_ADMIN_PREVIEW: "true"
      VITTA_ONE_QA_PASSWORD: "CI-ONLY-dummy-clinic-password-2026"
      QA_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Migrate disposable PostgreSQL
        run: reflex db migrate
      - name: Create strictly synthetic prescription data
        run: python -m scripts.qa_seed_prescriptions
      - name: Create synthetic accounts for full visual coverage
        run: python -m scripts.qa_seed_visual_accounts
      - name: Refresh generated frontend lock on disposable CI runner
        run: |
          # The committed lock can become incompatible with an expanded route graph.
          # Remove ONLY the generated copy in this temporary CI checkout.
          rm -rf reflex.lock
          mkdir -p qa-artifacts

      - name: Launch Reflex production server
        run: |
          set -euo pipefail
          (reflex run --env prod --frontend-port 3000 > qa-artifacts/reflex.log 2>&1 &)
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              echo "Reflex frontend is responding."
              exit 0
            fi
            sleep 2
          done
          tail -n 180 qa-artifacts/reflex.log
          exit 1
      - name: Browser QA — security, keyboard and responsive
        run: python -m pytest qa_browser/prescription_browser.py -q
      - name: Capture all protected and public screens in Chromium
        if: success()
        run: python -m qa_browser.capture_all_screens
      - name: Upload synthetic visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitta-one-chromium-all-screens
          path: qa-artifacts/
          retention-days: 90
