name: Validate professional specialty sync

on:
  push:
    branches:
      - chore/archive-professional-specialty-management

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate main specs
        run: npx -y @fission-ai/openspec@1.13.0 validate --specs
      - name: Validate change strict
        run: npx -y @fission-ai/openspec@1.13.0 validate add-professional-specialty-management --strict --no-interactive
