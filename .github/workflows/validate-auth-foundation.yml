name: Validate Vitta-One

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vitta_one
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitta_one"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vitta_one
      VITTA_ONE_SESSION_TTL_SECONDS: "3600"
      VITTA_ONE_COOKIE_SECURE: "false"
      VITTA_ONE_CLINIC_TIMEZONE: "America/Sao_Paulo"
      VITTA_ONE_QA_DISPOSABLE_DATABASE: "yes"
      REFLEX_TELEMETRY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate OpenSpec
        run: npx -y @fission-ai/openspec@1.13.0 validate --all --strict --no-interactive

      - name: Apply reviewed migration to disposable PostgreSQL
        run: reflex db migrate

      - name: Run test suite
        run: python -m pytest -q

      - name: Compile Reflex app
        run: reflex compile --dry
