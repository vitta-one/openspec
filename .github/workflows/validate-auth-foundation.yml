name: Validate auth foundation

on:
  push:
    branches:
      - feat/local-auth-rbac-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vitta_one
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitta_one"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/vitta_one
      VITTA_ONE_SESSION_TTL_SECONDS: "3600"
      VITTA_ONE_COOKIE_SECURE: "false"
      REFLEX_TELEMETRY_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Initialize and generate Reflex migration
        run: |
          reflex db init
          echo "Generated migration files:"
          find alembic -maxdepth 3 -type f -print

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: reflex-alembic-migration
          path: |
            alembic/
            alembic.ini
          if-no-files-found: error
          retention-days: 1

      - name: Run test suite
        run: python -m pytest -q

      - name: Compile Reflex app
        if: always()
        run: reflex compile --dry
